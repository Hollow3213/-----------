<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Task Tracker — приложение для управления задачами и проектами"
    />
    <title>Task Tracker — управление задачами</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/styles/variables.css" />
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="stylesheet" href="/styles/sidebar.css" />
    <link rel="stylesheet" href="/styles/header.css" />
    <link rel="stylesheet" href="/styles/main.css" />
    <script src="/scripts/sidebar.js" defer></script>
    <script src="/scripts/header.js" defer></script>
  </head>
  <body>
    <div class="layout">
      <div id="root">
        <script type="module" src="/src/main.jsx"></script>
      </div>
      <main class="main">
        <header class="header">
          <div class="header__actions">
            <div class="header__left">
              <!-- Поиск -->
              <search class="header__search">
                <form class="header__search-form" role="search">
                  <input
                    type="search"
                    id="search-input"
                    name="search"
                    class="header__search-input"
                    placeholder="Введите запрос..."
                    aria-label="Поиск задач"
                  />
                </form>
                <button
                  type="button"
                  class="header__search-button button"
                  aria-label="Найти"
                >
                  <svg
                    class="header__icon"
                    width="24"
                    height="24"
                    viewBox="0 0 21 21"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M21 18.086L19.5153 19.5L15.06015 15.258L16.54485 13.843L21 18.086ZM8.4 14C4.9266 14 2.1 11.309 2.1 8C2.1 4.692 4.9266 2 8.4 2C11.8734 2 14.7 4.692 14.7 8C14.7 11.309 11.8734 14 8.4 14ZM8.4 0C3.7611 0 0 3.582 0 8C0 12.418 3.7611 16 8.4 16C13.0389 16 16.8 12.418 16.8 8C16.8 3.582 13.0389 0 8.4 0Z"
                      fill="currentColor"
                    />
                  </svg>
                </button>
              </search>

              <!-- Уведомления -->
              <div class="header__notifications">
                <button
                  type="button"
                  class="header__notifications-button button"
                  aria-label="Уведомления"
                  aria-expanded="false"
                >
                  <svg
                    class="header__icon"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M9.00195 17H5.60636C4.34793 17 3.71872 17 3.58633 16.9023C3.4376 16.7925 3.40126 16.7277 3.38515 16.5436C3.37082 16.3797 3.75646 15.7486 4.52776 14.4866C5.32411 13.1835 6.00031 11.2862 6.00031 8.6C6.00031 7.11479 6.63245 5.69041 7.75766 4.6402C8.88288 3.59 10.409 3 12.0003 3C13.5916 3 15.1177 3.59 16.2429 4.6402C17.3682 5.69041 18.0003 7.11479 18.0003 8.6C18.0003 11.2862 18.6765 13.1835 19.4729 14.4866C20.2441 15.7486 20.6298 16.3797 20.6155 16.5436C20.5994 16.7277 20.563 16.7925 20.4143 16.9023C20.2819 17 19.6527 17 18.3943 17H15.0003M9.00195 17L9.00031 18C9.00031 19.6569 10.3435 21 12.0003 21C13.6572 21 15.0003 19.6569 15.0003 18V17M9.00195 17H15.0003"

                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"

                  </svg>
                </button>

                <div class="header__notifications-menu" hidden>
                  <!-- Здесь появятся уведомления -->
                </div>
              </div>
            </div>

            <div class="header__right">
              <!-- Переключатель темы -->
              <div class="header__theme">
                <input
                  type="checkbox"
                  class="header__theme-input"
                  id="theme-switch"
                  aria-label="Переключить тёмную тему"
                />
                <label class="header__theme-switch" for="theme-switch">
                  <span class="header__theme-slider"></span>
                </label>
              </div>

              <!-- Профиль -->
              <div class="header__profile">
                <button
                  type="button"
                  class="header__profile-button button"
                  aria-label="Меню профиля"
                  aria-expanded="false"
                >
                  <svg
                    class="header__icon"
                    width="24"
                    height="24"
                    viewBox="0 0 20 20"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >

                      d="M16.56 18H3.44C2.73 18 2.21 17.3 2.48 16.66C3.71 13.7 6.62 12 10 12C13.38 12 16.29 13.7 17.52 16.66C17.79 17.3 17.27 18 16.56 18ZM6.92 6C6.92 3.79 8.75 2 10 2C12.25 2 14.08 3.79 14.08 6C14.08 8.21 12.25 10 10 10C7.75 10 6.92 8.21 6.92 6Z"
                      fill="currentColor"
                    />
                  </svg>
                </button>

                <div class="header__profile-menu" hidden>
                  <a class="header__profile-link" href="#">Профиль</a>
                  <a class="header__profile-link" href="#">Настройки</a>

                    Выйти
                  </button>
                </div>
              </div>
            </div>
          </div>
